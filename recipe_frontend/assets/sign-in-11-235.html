<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - 11:235</title>
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./sign-in-11-235.css">
</head>
<body>
  <div id="screen-sign-in-11-235" class="screen">
    <!-- Status Bar -->
    <div class="status-bar">
      <!-- Time -->
      <div class="time" style="left: 0px; top: 12px; width: 180px; height: 22px; position: absolute;">
        <span class="time-text" style="left: 29.5px; top: 14px; position: absolute;">19:27</span>
      </div>
      <!-- Symbols frame -->
      <div class="symbols" style="left: 293.5px; top: 16.6px; width: 68px; height: 13px; position: absolute;">
        <!-- Battery -->
        <div class="battery" style="left: 336px; top: 17.16px; width: 24.5px; height: 11.5px; position: absolute;">
          <!-- Outer rect w/ opacity -->
          <div class="battery-outer" style="left: 0px; top: 0px; width: 24.5px; height: 11.5px; position: absolute; background: var(--style-33-bg); opacity: var(--style-33-opacity);"></div>
          <!-- Inner group Exclude -->
          <div class="battery-inner" style="left: 0px; top: 0px; width: 22px; height: 11.5px; position: absolute; background: #dadada;">
            <img src="figmaimages/figma_image_13_71_128_306.svg" alt="Battery Path" style="position:absolute; left:1px; top:1px; width:20px; height:9.5px;">
            <img src="figmaimages/figma_image_13_71_128_307.svg" alt="Battery Path" style="position:absolute; left:0px; top:0px; width:22px; height:11.5px;">
          </div>
          <!-- Tip -->
          <div class="battery-tip" style="position:absolute; left:23px; top:2.69px; width:1.5px; height:4px; background: var(--color-000000);"></div>
        </div>
        <!-- Combined shape bars -->
        <div class="combined-bars" style="left: 0px; top: 0px; width: 17.1px; height: 10.7px; position: absolute;">
          <img src="figmaimages/figma_image_13_71_128_311.svg" alt="Bar1" style="position:absolute; left:0px; top:6.7px; width:3px; height:4px;">
          <img src="figmaimages/figma_image_13_71_128_312.svg" alt="Bar2" style="position:absolute; left:4.8px; top:4.7px; width:3px; height:6px;">
          <img src="figmaimages/figma_image_13_71_128_313.svg" alt="Bar3" style="position:absolute; left:9.4px; top:2.4px; width:3px; height:8.3px;">
          <img src="figmaimages/figma_image_13_71_128_314.svg" alt="Bar4" style="position:absolute; left:14.1px; top:0px; width:3px; height:10.7px;">
        </div>
        <!-- Wi-Fi (placeholder paths) -->
        <div class="wifi" style="left: 22.1px; top: 0px; width: 15.4px; height: 11.06px; position: absolute;">
          <div style="position:absolute; left:0; top:0; width:15.4px; height:4.78px; background: var(--color-000000); opacity:0.2;"></div>
          <div style="position:absolute; left:2.69px; top:3.83px; width:10.03px; height:3.66px; background: var(--color-000000); opacity:0.2;"></div>
          <div style="position:absolute; left:5.37px; top:7.65px; width:4.66px; height:3.40px; background: var(--color-000000); opacity:0.2;"></div>
        </div>
        <!-- Battery fill rectangle -->
        <img src="figmaimages/figma_image_13_71_128_309.svg" alt="Battery Fill" style="position:absolute; left: 44.5px; top: 2.48px; width: 18px; height: 7.6667px;">
      </div>
    </div>

    <!-- Title Group -->
    <div class="title-group" style="left: 30px; top: 94px; width: 155px; height: 75px; position: absolute;">
      <span class="txt-hello" style="position:absolute; left:0px; top:0px;">Hello,</span>
      <span class="txt-welcome" style="position:absolute; left:0px; top:45px;">Welcome Back!</span>
    </div>

    <!-- Input: Email -->
    <div class="input-field email" style="left: 30px; top: 226px; width: 315px; height: 81px; position: absolute;">
      <span class="label" style="position:absolute; left:0px; top:0px;">Email</span>
      <div class="input-bg" style="position:absolute; left:0px; top:26px; width:315px; height:55px;"></div>
      <span class="placeholder" style="position:absolute; left:20px; top:45px;">Enter Email</span>
    </div>

    <!-- Input: Password -->
    <div class="input-field password" style="left: 30px; top: 337px; width: 315px; height: 81px; position: absolute;">
      <span class="label" style="position:absolute; left:0px; top:0px;">Enter Password</span>
      <div class="input-bg" style="position:absolute; left:0px; top:26px; width:315px; height:55px;"></div>
      <span class="placeholder" style="position:absolute; left:20px; top:45px;">Enter Password</span>
    </div>

    <!-- Forgot Password -->
    <div class="forgot" style="left: 40px; top: 438px; width: 97px; height:17px; position: absolute;">
      <span class="forgot-text">Forgot Password?</span>
    </div>

    <!-- Big Button: Sign In -->
    <button class="big-button" style="left: 30px; top: 480px; width: 315px; height: 60px; position: absolute;">
      <span class="button-label">Sign In</span>
      <img class="button-arrow" src="figmaimages/figma_image_54_668_53_625.svg" alt="Arrow Right" />
    </button>

    <!-- Divider line group -->
    <div class="divider" style="left: 90px; top: 560px; width: 195px; height: 17px; position: absolute;">
      <div class="line left"></div>
      <span class="or-text">Or Sign in With</span>
      <div class="line right"></div>
    </div>

    <!-- Social buttons -->
    <div class="social google" style="left: 131px; top: 597px; width: 44px; height: 44px; position:absolute;">
      <div class="social-bg"></div>
      <!-- Google logo parts -->
      <img src="figmaimages/figma_image_13_39.svg" alt="G part" style="position:absolute; left:12px; top:12px; width:20px; height:20px;">
      <div class="g-red" style="position:absolute; left:13.153px; top:12px; width:15.656px; height:7.755px;"></div>
      <div class="g-green" style="position:absolute; left:13.097px; top:24.027px; width:15.607px; height:7.973px;"></div>
      <img src="figmaimages/figma_image_13_42.svg" alt="G blue" style="position:absolute; left:22px; top:20px; width:10px; height:9.414px;">
    </div>

    <div class="social facebook" style="left: 200px; top: 597px; width: 44px; height: 44px; position:absolute;">
      <div class="social-bg"></div>
      <div class="fb-bg" style="position:absolute; left:10px; top:10px; width:24px; height:24px;"></div>
      <img src="figmaimages/figma_image_13_58.svg" alt="Facebook Vector" style="position:absolute; left:12px; top:12px; width:20px; height:20px;">
    </div>

    <!-- Sign up link -->
    <div class="signup" style="left: 99px; top: 696px; width: 177px; height: 17px; position: absolute;">
      <span class="signup-text">Don’t have an account? Sign up</span>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator" style="left: 0px; top: 778px; width: 375px; height:34px; position:absolute;">
      <div class="home-line" style="left: 120px; top: 21px; width: 135px; height: 5px; position:absolute;"></div>
    </div>
  </div>

  <script src="./sign-in-11-235.js"></script>
</body>
</html>
